<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="easycut.css">
</head>
<body>
    <!-- tag ul e li -->
     <!-- header ou cabeçario ou toolbar -->
      <!-- href li ou -->
    <section> 
        <h1>Olá seja bem vindo a nossa Barbearia EasyCut.</h1><br>
        <p>Para conhecer nossos serviços realize nosso cadrastro.</p>
        
        <div class="login">
            <form>
            
                <h2>Login de cadrastro</h2><br>
            <label for="name">Nome:</label>
            <input type="text" name="nome" id="nome"><br>
            <label for="nunber">Telefone:</label>
            <input type="tel" name="number" id="Telefone"><br>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email"><br>
            <button>Enviar</button>

            </form>
        </div>

    </section>
    
    <section>
        <h2>Confira nossos valores de serviços e planos.</h2><br>

        <div class="tabela">
            <table>
                <tr>
                    <th>Serviços</th>
                    <th>Preços</th>
                </tr>
                <tr>
                    <td>Corte Social</td>
                    <td>R$ 25,00</td>

                </tr>
                <tr>
                    <td>Corte Degrade</td>
                    <td>R$ 35,00</td>

                </tr>
                <tr>
                    <td>Barba</td>
                    <td>R$ 30,00</td>

                </tr>
                <tr>
                    <td>Corte e Barba</td>
                    <td>R$ 50,00</td>

                </tr>
           </table>    
        </div>
            
        
    </section>

    <section>
        <div class="estilo-C">
            <div class="image-card">
                <img src="background/imgC1.jpg" alt="img1" />
            </div>
            <div class="image-card">
                <img src="background/imgC2.jpg" alt="img2" />
            </div>
            <div class="image-card">
                <img src="background/imgC3.webp" alt="img3" />
            </div>
            <div class="image-card">
                <img src="background/imgC4.jpg" alt="img4" />
            </div>
        </div>
    </section>
    
</body>
</html>
